name: TSK-62 Gate 3 standard-runner validation

on:
  push:
    branches:
      - validation/tsk-62-gate3-standard-runners

permissions:
  contents: read

concurrency:
  group: tsk-62-gate3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS & TS checks (standard runner)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Grab npm 12
        run: npm --version | grep -q '^12\.' || npm i -g npm@12
      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci
      - name: Run all workspace checks
        run: node .github/scripts/run-workspace-checks.mjs

  python:
    name: Python full test (standard runner)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11
      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web
      - name: Minimize uv cache
        run: uv cache prune --ci
      - name: Run tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh
        env:
          HERMES_TEST_WORKERS: 4
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

  windows:
    name: Windows-only tests (standard runner)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11
      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web
      - name: Minimize uv cache
        run: uv cache prune --ci
      - name: Run windows_only tests
        shell: bash
        run: |
          set -uo pipefail
          LIST="${RUNNER_TEMP:-.}/selected-tests.txt"
          if ! uv run --no-sync python scripts/ci/list_os_marked_tests.py \
                 windows_only > "$LIST"; then
            echo "::error::could not enumerate windows_only test files"
            exit 1
          fi
          if [ ! -s "$LIST" ]; then
            echo "::error::empty windows_only file list"
            exit 1
          fi
          set -- $(cat "$LIST")
          echo "selected $# file(s) for windows_only:"
          cat "$LIST"
          status=0
          uv run --no-sync python -m pytest \
            "$@" \
            -m "windows_only and not integration" \
            -v --tb=short || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::error::No tests matched -m windows_only."
            exit 1
          fi
          exit "$status"
        env:
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

  nix:
    name: Nix flake check (standard runner)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            fallback = true
            tarball-ttl = 3600
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'pyproject.toml', 'uv.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
          gc-max-store-size-linux: 5G
          purge: false
      - name: Nix flake check
        run: nix flake check --print-build-logs
